<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header + Toggle Dark Mode -->
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        </header>

        <!-- Total Balance -->
        <div class="balance-card">
            <p class="balance-label">TOTAL BALANCE</p>
            <h2 id="totalBalance">$0.00</h2>
        </div>

        <!-- Budget Limit (Optional Challenge 3) -->
        <div class="limit-card">
            <label for="budgetLimit">Set Budget Limit: $</label>
            <input type="number" id="budgetLimit" placeholder="100" min="0" step="0.01">
            <button id="setLimitBtn">Set Limit</button>
            <p id="limitWarning" class="warning hidden">⚠️ Spending melebihi limit!</p>
        </div>

        <!-- Form Input -->
        <div class="form-card">
            <h3>Add Transaction</h3>
            <form id="transactionForm">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" placeholder="Contoh: Makan Siang" required>

                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Fun">Fun</option>
                </select>

                <button type="submit" class="btn-add">Add Transaction</button>
            </form>
        </div>

        <!-- Sort Control (Optional Challenge 2) -->
        <div class="sort-card">
            <label for="sortBy">Sort by:</label>
            <select id="sortBy">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="amount-high">Amount: High to Low</option>
                <option value="amount-low">Amount: Low to High</option>
                <option value="category">Category (A-Z)</option>
            </select>
        </div>

        <!-- Transaction List + Chart -->
        <div class="content-grid">
            <div class="list-card">
                <h3>Transactions</h3>
                <ul id="transactionList"></ul>
                <p id="emptyMessage" class="empty">Belum ada transaksi</p>
            </div>

            <div class="chart-card">
                <h3>Spending by Category</h3>
                <canvas id="expenseChart"></canvas>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
